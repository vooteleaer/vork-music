[package]
name = "vork-music-jni"
description = "vØrk Music for Android: the music core to Kotlin, through JNI, as JSON"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "vork_music"
crate-type = ["cdylib"]

[dependencies]
vork-music-core = { path = "../../core" }
jni = { version = "0.21", default-features = false }
serde_json = "1"
